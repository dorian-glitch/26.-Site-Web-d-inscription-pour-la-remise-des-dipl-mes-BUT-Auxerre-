</head>

<body class="container">


    <header class="row">

        <article class="col-sm-4">
            <p>
                <img src="./img/logoauxerre-removebg-preview.png" alt="logo iut auxerre">
            </p>
        </article>

        <article class="col-sm-8">

            <h1>Bienvenue à l'IUT de Auxerre</h1>

            <p class="tac">Université de Bourgogne</p>

            <nav>
                <a href="index.html">
                    <button type="button" class="btn btn-nav">Accueil</button>
                </a>

                <a href="inscription.html">

                <a href="demander_devis.html">
                    <button type="button" class="btn btn-nav">Contacts</button>
                </a>
            </nav>

        </article>

    </header>

    <section>
    <h3>Formulaire d'inscription</h3>

        <form action="formulaire.php" method="GET">

            <!-- IDENTITÉ -->
            <fieldset>

                <legend>Identité</legend>

                <label>Nom *</label>
                <input type="text" name="nom" required>

                <br><br>

                <label>Prénom *</label>
                <input type="text" name="prenom" required>

                <br><br>

                <label>Date de naissance *</label>
                <input type="date" name="date_naissance" required>

                <br><br>

                <label>Numéro étudiant *</label>
                <input type="text" name="num_etudiant" required>

            </fieldset>

            <br>

            <!-- CONTACT -->
            <fieldset>

                <legend>Contact</legend>

                <label>Email *</label>
                <input type="email" name="email" required>

                <br><br>

                <label>Téléphone *</label>
                <input type="tel" name="telephone" required>

            </fieldset>

            <br>

            <!-- FORMATION -->
            <fieldset>

                <legend>Formation</legend>

                <label>Filière *</label>

                <select name="filiere" required>
                    <option value="">Choisir</option>
                    <option>GCCD</option>
                    <option>RT</option>
                    <option>TC</option>
                </select>

                <br><br>

                <label>Année diplôme *</label>
                <input type="number" name="annee" required>

            </fieldset>

            <br>

            <!-- PARTICIPATION -->
            <fieldset>

                <legend>Participation</legend>

                <label>Présence *</label>

                <select name="presence" required>
                    <option value="">Choisir</option>
                    <option value="oui">Oui</option>
                    <option value="non">Non</option>
                </select>

                <br><br>

                <label>Nombre d’accompagnants (max 2)</label>

                <select id="nb_accompagnants" name="accompagnants">
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>

            </fieldset>

            <br>

            <!-- ACCOMPAGNANTS -->
            <fieldset id="bloc_accompagnants" style="display:none;">

                <legend>Accompagnants</legend>

                <h4>Accompagnant 1</h4>

                <label>Nom</label>
                <input type="text" name="acc1_nom">

                <br><br>

                <label>Prénom</label>
                <input type="text" name="acc1_prenom">

                <br><br>

                <div id="acc2" style="display:none;">

                    <h4>Accompagnant 2</h4>

                    <label>Nom</label>
                    <input type="text" name="acc2_nom">

                    <br><br>

                    <label>Prénom</label>
                    <input type="text" name="acc2_prenom">

                </div>

            </fieldset>

            <br>

            <!-- RGPD -->
            <fieldset>

                <legend>RGPD</legend>

                <label>
                    <input type="checkbox" required>
                    J’accepte l’utilisation de mes données pour l’organisation
                </label>

            </fieldset>

            <br>

            <button type="submit">S’inscrire</button>

        </form>

    </section>

    <footer class="row">

        <article class="col-sm-4">
            <p>
                <a href="#">
                    <img src="./img-icones/email_rounded07_82197.png" alt="email">
                </a>
                Nous contacter
            </p>
        </article>

        <article class="col-sm-6 text-center">
            <p>
                <a href="#">
                    <img src="./img-icones/facebook_108044.png" alt="facebook">
                </a>

                <a href="#">
                    <img src="./img-icones/instagram_108043.png" alt="instagram">
                </a>

                <a href="#">
                    <img src="./img-icones/messengerf_108040.png" alt="messenger">
                </a>

                <a href="#">
                    <img src="./img-icones/whatsapp_108042.png" alt="whatsapp">
                </a>
            </p>
        </article>

        <article class="col-sm-2 text-end">
            <p>@ R&T Production</p>
        </article>

    </footer>

    <!-- SCRIPT JS -->
    <script>

        const select = document.getElementById("nb_accompagnants");
        const bloc = document.getElementById("bloc_accompagnants");
        const acc2 = document.getElementById("acc2");

        select.addEventListener("change", function () {

            const value = parseInt(this.value);

            if (value === 0) {
                bloc.style.display = "none";
                acc2.style.display = "none";
            }

            if (value === 1) {
                bloc.style.display = "block";
                acc2.style.display = "none";
            }

            if (value === 2) {
                bloc.style.display = "block";
                acc2.style.display = "block";
            }

        });

    </script>

    <!-- Bootstrap -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
